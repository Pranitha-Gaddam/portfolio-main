<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 500" width="1250" height="500" role="img" aria-label="Two-tier cache lookup: requests short-circuit at an exact tier and a semantic tier before reaching the paid upstream API">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbf9"/>
      <stop offset="0.55" stop-color="#f4f2ee"/>
      <stop offset="1" stop-color="#eae7e1"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="1250" height="500" fill="url(#vignette)"/>
    </mask>

    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2.2" fill="#2a2723" fill-opacity="0.075"/>
    </pattern>

    <radialGradient id="halo">
      <stop offset="0" stop-color="#1c7a68" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#1c7a68" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#1c7a68" stop-opacity="0"/>
    </radialGradient>

    <marker id="arrowHit" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1c7a68"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#a9a29a"/>
    </marker>

    <style>
      .mono { font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
      .node-title { font-size: 34px; font-weight: 600; letter-spacing: 0.05em; fill: #2c2925; }
      .node-sub   { font-size: 24px; letter-spacing: 0.02em; fill: #8b847b; }
      .tag-hit    { font-size: 28px; letter-spacing: 0.04em; fill: #1c7a68; }
      .tag-dim    { font-size: 24px; letter-spacing: 0.04em; fill: #a8a199; }
      .tag-entry  { font-size: 24px; letter-spacing: 0.06em; fill: #8b847b; }
    </style>
  </defs>

  <rect width="1250" height="500" fill="url(#ground)"/>
  <rect width="1250" height="500" fill="url(#dots)" mask="url(#dotMask)"/>

  <g transform="translate(0,-14)">

    <!-- entry -->
    <text class="mono tag-entry" x="52" y="178">request</text>
    <circle cx="196" cy="170" r="10" fill="#3c3833"/>
    <path d="M206,170 H252" stroke="#c3bdb4" stroke-width="3" fill="none"/>

    <!-- tier 1 hit path -->
    <path d="M596,170 H812" stroke="#1c7a68" stroke-opacity="0.16" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M596,170 H812" stroke="#1c7a68" stroke-width="3.6" fill="none" marker-end="url(#arrowHit)"/>
    <circle cx="866" cy="170" r="58" fill="url(#halo)"/>
    <circle cx="866" cy="170" r="13" fill="#1c7a68"/>
    <text class="mono tag-hit" x="906" y="180">HIT · exact</text>

    <!-- tier 1 miss, down into tier 2 -->
    <path d="M310,226 V300 Q310,326 336,326 H366" stroke="#c3bdb4" stroke-width="3" fill="none"/>

    <!-- tier 2 hit path -->
    <path d="M746,326 H812" stroke="#1c7a68" stroke-opacity="0.16" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M746,326 H812" stroke="#1c7a68" stroke-width="3.6" fill="none" marker-end="url(#arrowHit)"/>
    <circle cx="866" cy="326" r="58" fill="url(#halo)"/>
    <circle cx="866" cy="326" r="13" fill="#1c7a68"/>
    <text class="mono tag-hit" x="906" y="336">HIT · semantic</text>

    <!-- tier 2 miss, out to the paid call -->
    <path d="M470,382 V418 Q470,444 496,444 H1040" stroke="#bdb7ae" stroke-width="2.6" stroke-dasharray="3 12" stroke-linecap="round" fill="none" marker-end="url(#arrowDim)"/>
    <text class="mono tag-dim" x="520" y="428">upstream · paid</text>

    <!-- tier 1 node -->
    <rect x="252" y="114" width="344" height="112" rx="20" fill="#ffffff" stroke="#ded8cf" stroke-width="2.4"/>
    <text class="mono node-title" x="288" y="164">TIER 1</text>
    <text class="mono node-sub" x="288" y="198">exact match</text>

    <!-- tier 2 node -->
    <rect x="366" y="270" width="380" height="112" rx="20" fill="#ffffff" stroke="#ded8cf" stroke-width="2.4"/>
    <text class="mono node-title" x="402" y="320">TIER 2</text>
    <text class="mono node-sub" x="402" y="354">semantic KNN</text>

  </g>
</svg>
